targets:
  $default:
    builders:
      json_serializable:
        options:
          explicit_to_json: true
      # TODO: вернуть стандартный генератор после исправления конфликта «Asset already exists»
      # https://github.com/slang-i18n/slang/issues/351
      slang_build_runner:
        enabled: false
        # CLI Slang читает настройки из секции стандартного генератора
        options: &slang_options
          base_locale: ru
          fallback_strategy: base_locale
          input_directory: lib/i18n
          input_file_pattern: .i18n.json
          output_directory: lib/i18n
          output_file_name: translations.g.dart
          flutter_integration: true
          locale_handling: true
          lazy: false
          enum_name: AppLocale
          class_name: Translations
          translate_var: t
          key_case: camel
          key_map_case: camel
          string_interpolation: double_braces
          timestamp: false
      slang_build_runner:legacy:
        enabled: true
        options: *slang_options
